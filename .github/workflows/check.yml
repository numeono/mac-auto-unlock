name: Build and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: zsh test.sh
      - run: zsh build.sh
      - run: zsh -n build.sh install.sh test.sh
